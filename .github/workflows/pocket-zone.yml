name: Pocket Zone experimental APK
on:
  push:
    branches: ['experiment/pocket-zone/**']
    paths: ['experiments/pocket-zone/**', '.github/workflows/pocket-zone.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pocket-zone-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POCKET_ZONE_KEYSTORE: ${{ github.workspace }}/.pocket-zone-signing/pocket-zone-tests.keystore
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check isolation from the original app
        run: python3 experiments/pocket-zone/check-isolation.py
      - name: Install fixture browser
        timeout-minutes: 6
        run: |
          npm install --prefix "$RUNNER_TEMP/zone-node" playwright@1.56.1
          test -x "$CHROME_BIN"
          "$CHROME_BIN" --version
      - name: Test extraction against local fixtures only
        env:
          NODE_PATH: ${{ runner.temp }}/zone-node/node_modules
          POCKET_ZONE_TEST_BROWSER: /usr/bin/google-chrome
        run: node --test experiments/pocket-zone/extract.test.cjs
      - name: Restore the isolated signing key
        id: zone-key
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.pocket-zone-signing
          key: pocket-zone-explicit-signing-key-v2
      - name: Prepare or validate the isolated signing key
        run: |
          if [ ! -f "$POCKET_ZONE_KEYSTORE" ]; then
            if [ -f experiments/pocket-zone/signing-certificate.sha256 ]; then
              echo "Signing key unavailable. Restore the private backup; refusing to rotate the certificate."
              exit 1
            fi
            mkdir -p "$(dirname "$POCKET_ZONE_KEYSTORE")"
            keytool -genkeypair -noprompt -keystore "$POCKET_ZONE_KEYSTORE" -storetype JKS -storepass android -keypass android -alias pocket-zone-tests -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=Pocket Zone Tests, OU=Experimental, O=Demeberant, C=CL"
          fi
          keytool -list -keystore "$POCKET_ZONE_KEYSTORE" -storepass android -alias pocket-zone-tests > /dev/null
      - name: Encrypt a recovery copy without exposing the private key
        if: steps.zone-key.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/zone-key-backup"
          openssl rand -hex 32 > "$RUNNER_TEMP/zone-backup-password"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in "$POCKET_ZONE_KEYSTORE" -out "$RUNNER_TEMP/zone-key-backup/keystore.enc" -pass "file:$RUNNER_TEMP/zone-backup-password"
          openssl pkeyutl -encrypt -pubin -inkey experiments/pocket-zone/signing-backup-public.pem -in "$RUNNER_TEMP/zone-backup-password" -out "$RUNNER_TEMP/zone-key-backup/password.enc" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          rm "$RUNNER_TEMP/zone-backup-password"
      - uses: actions/upload-artifact@v4
        if: steps.zone-key.outputs.cache-hit != 'true'
        with:
          name: pocket-zone-encrypted-signing-backup
          retention-days: 7
          path: ${{ runner.temp }}/zone-key-backup/*
      - name: Build and test only the standalone experiment
        run: ./gradlew -p experiments/pocket-zone testDebugUnitTest lintDebug assembleDebug --no-daemon
      - name: Verify separate APK identity and signature
        run: |
          python3 experiments/pocket-zone/check-isolation.py --apk-metadata
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs experiments/pocket-zone/build/outputs/apk/debug/*-debug.apk > experiments/pocket-zone/build/outputs/apk/debug/signing-certificate.txt
          python3 - <<'PY_PIN'
          from pathlib import Path
          import re
          certificate = Path('experiments/pocket-zone/build/outputs/apk/debug/signing-certificate.txt').read_text()
          digest = re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]+)', certificate).group(1).lower()
          pin = Path('experiments/pocket-zone/signing-certificate.sha256')
          if pin.exists():
              assert digest == pin.read_text().strip().lower(), 'Certificate changed; APK rejected'
          print('Verified signer SHA-256:', digest)
          PY_PIN
          sha256sum experiments/pocket-zone/build/outputs/apk/debug/*-debug.apk
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('experiments/pocket-zone/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          assert reports
          roots = [ET.parse(p).getroot() for p in reports]
          totals = {k: sum(int(r.get(k, '0')) for r in roots) for k in ('tests', 'failures', 'errors', 'skipped')}
          assert totals['failures'] == totals['errors'] == totals['skipped'] == 0, totals
          lint = ET.parse('experiments/pocket-zone/build/reports/lint-results-debug.xml').getroot()
          issues = lint.findall('issue')
          assert not any(i.get('severity') in ('Error', 'Fatal') for i in issues)
          message = f"Experimental Java tests: {totals}\nLint findings: {len(issues)}\n"
          print(message)
          Path('experiments/pocket-zone/build/reports/validation-summary.txt').write_text(message)
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pocket-zone-pruebas-apk
          path: |
            experiments/pocket-zone/build/outputs/apk/debug/*.apk
            experiments/pocket-zone/build/outputs/apk/debug/signing-certificate.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pocket-zone-pruebas-reports
          path: experiments/pocket-zone/build/reports/
